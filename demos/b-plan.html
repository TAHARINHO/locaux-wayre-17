<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<title>B · le plan vivant</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  .msg{justify-content:flex-start;padding-top:40px}
  .msg h3{font-size:31px}
  .plan{fill:none;stroke:rgba(235,203,112,.55);stroke-width:1.3;vector-effect:non-scaling-stroke;
    stroke-dasharray:1;stroke-dashoffset:1;animation:draw 9s linear infinite}
  .plan.thin{stroke:rgba(235,203,112,.2);stroke-width:1}
  @keyframes draw{0%{stroke-dashoffset:1}18%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}

  .room{fill:rgba(235,203,112,.07);stroke:rgba(235,203,112,.62);stroke-width:1;vector-effect:non-scaling-stroke;
    stroke-dasharray:1;stroke-dashoffset:1;animation:draw .8s linear infinite, fill 9s ease-in-out infinite}
  @keyframes fill{
    0%,22%{fill:rgba(235,203,112,.05)}
    32%{fill:rgba(235,203,112,.26)}
    58%{fill:rgba(235,203,112,.26)}
    72%{fill:rgba(235,203,112,.08)}
    100%{fill:rgba(235,203,112,.03)}
  }
  .rtxt{font-family:Sora;font-size:9px;letter-spacing:.18em;fill:rgba(247,243,233,.78);text-transform:uppercase}
  .dim{stroke:rgba(143,217,210,.45);stroke-width:.8;vector-effect:non-scaling-stroke;
    stroke-dasharray:1;stroke-dashoffset:1;animation:draw 9s linear infinite}
  .dtxt{font-family:Sora;font-size:8px;letter-spacing:.14em;fill:rgba(143,217,210,.6)}

  .route{fill:none;stroke:#FFF3D2;stroke-width:2;stroke-linecap:round;vector-effect:non-scaling-stroke;
    stroke-dasharray:1;stroke-dashoffset:1;animation:draw9 9s ease-in-out infinite;
    filter:drop-shadow(0 0 6px rgba(255,240,200,.8))}
  @keyframes draw9{0%,36%{stroke-dashoffset:1}66%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
  .pulse{fill:#FFF6DF;filter:drop-shadow(0 0 10px rgba(255,240,200,1))}
</style></head>
<body>
<div class="bg"></div>

<svg class="stage" viewBox="0 0 1440 470" preserveAspectRatio="none">
  <!-- enveloppe -->
  <path class="plan" pathLength="1" d="M60 122 H1380 V392 H60 Z"/>
  <!-- trame de façade -->
  <g>
    <line class="plan thin" x1="110" y1="122" x2="110" y2="392"/>
    <line class="plan thin" x1="880" y1="122" x2="880" y2="392"/>
    <line class="plan thin" x1="1330" y1="122" x2="1330" y2="392"/>
  </g>
  <!-- les deux locaux -->
  <rect class="room" pathLength="1" x="110" y="206" width="400" height="164" rx="2"/>
  <rect class="room" pathLength="1" x="930" y="206" width="400" height="164" rx="2"/>
  <!-- cloison centrale / couloir -->
  <path class="plan" pathLength="1" d="M510 250 H930 M510 326 H930"/>
  <text class="rtxt" x="130" y="234">Local loué · 7 %</text>
  <text class="rtxt" x="950" y="234">Local libre · aménagé</text>
  <text class="rtxt" x="560" y="296">Palier commun</text>

  <!-- cotes -->
  <line class="dim" pathLength="1" x1="110" y1="410" x2="510" y2="410"/>
  <line class="dim" pathLength="1" x1="110" y1="404" x2="110" y2="416"/>
  <line class="dim" pathLength="1" x1="510" y1="404" x2="510" y2="416"/>
  <text class="dtxt" x="310" y="404" text-anchor="middle">77,40 M² CARREZ</text>
  <line class="dim" pathLength="1" x1="930" y1="410" x2="1330" y2="410"/>
  <text class="dtxt" x="1130" y="404" text-anchor="middle">77,40 M² CARREZ</text>
  <text class="dtxt" x="1380" y="404" text-anchor="end">PLAN · PARIS 17E · ÉCH. 1/100</text>
</svg>

<div class="veil" style="background:radial-gradient(62% 58% at 50% 22%,rgba(7,15,28,.94) 18%,rgba(7,15,28,.5) 60%,transparent 100%)"></div>

<svg class="over" viewBox="0 0 1440 470" preserveAspectRatio="none">
  <!-- trajet du dossier, d'un local à l'autre -->
  <path id="route" class="route" pathLength="1" d="M310 288 H1130"/>
  <circle class="pulse" r="6">
    <animateMotion dur="9s" repeatCount="indefinite" calcMode="linear"
      keyPoints="0;0;1;1" keyTimes="0;0.36;0.72;1" path="M310 288 H1130"/>
  </circle>
</svg>

<div class="msg">
  <h3>L'immobilier, <b>sans intermédiaire.</b></h3>
  <p>Le dossier du vendeur arrive directement chez l'acheteur. Aucun bureau entre les deux.</p>
</div>

<div class="badge" id="badge">0 € de commission</div>

<div class="marquee"><span>Paris 17e</span><span>77 m² Carrez</span><span>Diagnostics 2026</span><span>Visite sur rendez-vous</span><span>Wayre</span></div>

<script>
/* le tampon apparaît à la fin du trajet, puis tout repart */
(function(){
  const badge=document.getElementById('badge');
  function loop(ts){
    const p=(ts%9000)/9000;
    badge.classList.toggle('on', p>0.70 && p<0.94);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body></html>
